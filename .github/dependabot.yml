version: 2
# A new .NET SDK means global.json, both Dockerfile tags and every packages.lock.json in one change (docs/deploy.md):
# the SDK and the two images come as one pull request, and .github/workflows/dependabot-locks.yml adds the lock files to it.
multi-ecosystem-groups:
  dotnet-sdk:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: nuget
    directories:
      - /tools/backup
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: dotnet-sdk
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dotnet-sdk
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # a new .NET major is a migration (target framework), not an update
  - package-ecosystem: docker
    directory: /src/Web
    patterns: ["dotnet/sdk", "dotnet/aspnet"]
    multi-ecosystem-group: dotnet-sdk
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
