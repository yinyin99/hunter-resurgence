version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /tools/backup
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /src/Web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # bumped by hand with global.json and every packages.lock.json in one change (docs/deploy.md); a tag-only bump breaks the locked restore
    ignore:
      - dependency-name: "dotnet/sdk"
      - dependency-name: "dotnet/aspnet"
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
