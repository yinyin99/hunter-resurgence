name: ci
on:
  push:
    branches: [main]
  pull_request:
  # dependabot-locks.yml starts it for the lock-file commit it pushes (a push with GITHUB_TOKEN starts no workflow); never deploys (deploy.yml: push only)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      RestoreLockedMode: "true" # every restore of this job (build, test, publish.cmd) fails with NU1004 when a packages.lock.json does not match its project
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sdk
      - run: dotnet build hunter-resurgence.slnx -c Release
      - run: dotnet test hunter-resurgence.slnx -c Release --no-build
      # the release's publish and zip step, with the example settings: a change that breaks it fails the pull request, not a release tag (tags cannot be reused)
      - name: Publish the backup tool
        shell: cmd
        run: tools\backup\publish.cmd tools\backup\settings.example.json 0.0.0-ci
      - name: Check the release zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "tools\backup\bin\Release\net10.0-windows\win-x64\backup-win-x64.zip"))
          $names = ($zip.Entries.FullName | Sort-Object) -join ","
          $zip.Dispose()
          if ($names -ne "backup.exe,settings.json") { throw "zip holds: $names" }
      # the player kit's release zip, the same way (tools/play)
      - name: Publish the player kit
        shell: cmd
        run: tools\play\publish.cmd tools\play\settings.example.json 0.0.0-ci
      - name: Check the player kit's release zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "tools\play\bin\Release\net10.0-windows\win-x64\play-win-x64.zip"))
          $names = ($zip.Entries.FullName | Sort-Object) -join ","
          $zip.Dispose()
          if ($names -ne "1-setup.cmd,2-run.cmd,3-remove.cmd,play.exe,settings.json") { throw "zip holds: $names" }
  # the server's tests on Linux too: operators run the community server on a VPS (the build job above runs them on Windows with the rest of the solution)
  server-ubuntu:
    runs-on: ubuntu-latest
    env:
      RestoreLockedMode: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sdk
      - run: dotnet test --project server/Server.Tests -c Release
      - run: echo ${{ github.nope }}
  # the workflows, the compose file and the firewall script: errors here show only on main, on a tag or on the VPS
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -shellcheck=
      - name: Check the compose file
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.example config -q
      - name: Check the firewall script
        run: shellcheck deploy/firewall.sh
      # iptables and curl are stubs that log their calls: no ranges from Cloudflare must change nothing
      - name: Firewall script with stubbed iptables
        run: |
          dir=$(mktemp -d)
          printf '%s\n' '#!/bin/sh' 'echo "$*" >> "$LOG"' 'case "$*" in "-n -L DOCKER-USER") exit 0;; "-C "*|"-N CLOUDFLARE") exit 1;; esac' > "$dir/iptables"
          printf '%s\n' '#!/bin/sh' '[ "$*" = "-n -L DOCKER-USER" ] && exit 1' 'exit 0' > "$dir/ip6tables"
          printf '%s\n' '#!/bin/sh' "printf '%s' \"\$RANGES\"" > "$dir/curl"
          chmod +x "$dir"/*
          export PATH="$dir:$PATH" LOG="$dir/log"
          : > "$LOG"
          if RANGES="" sh deploy/firewall.sh; then exit 1; fi
          if grep -q -- '-j DROP' "$LOG"; then exit 1; fi
          RANGES="198.51.100.0/24 203.0.113.0/24" sh deploy/firewall.sh
          grep -qx -- '-A CLOUDFLARE -s 198.51.100.0/24 -j RETURN' "$LOG"
          grep -qx -- '-A CLOUDFLARE -j DROP' "$LOG"
          grep -qx -- '-I DOCKER-USER -i eth0 -p tcp -m multiport --dports 80,443 -j CLOUDFLARE' "$LOG"
  # the website's container image (deploy/): builds, starts, serves the banner, the import map of shell.js and the search engine tags, lists Linux time zones, serves robots.txt, sends the security headers, and shows the operator's pictures from IMAGES_DIR
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f src/Web/Dockerfile -t web:ci .
      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:8080 web:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/feed > feed.html && break; sleep 1; done
          grep -q "Work in progress" feed.html
          grep -qE '_content/Resurgence\.Ui/shell\.[a-z0-9]+\.js' feed.html # the import map sends shell.js to its fingerprinted file (docs/website.md)
          grep -qE 'og:image" content="http://localhost:8080/apple-touch-icon\.[a-z0-9]+\.png"' feed.html # docs/website.md#search-engines
          grep -q '<h1 class="visually-hidden"' feed.html
          curl -sf http://localhost:8080/settings/language | grep -q 'value="Europe/Paris"'
          curl -sf http://localhost:8080/robots.txt | grep -q '^User-agent: MJ12bot' # docs/website.md
          # the security headers on a page and on the 404 page (docs/website.md#security-headers)
          for path in /feed /no-such-page; do
            curl -s -D headers.txt -o /dev/null "http://localhost:8080$path"
            grep -qi '^strict-transport-security: max-age=31536000' headers.txt
            grep -qi '^x-content-type-options: nosniff' headers.txt
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' headers.txt
            grep -qi "^content-security-policy: frame-ancestors 'none'" headers.txt
          done
          if grep -q 'asset-slot has-image' feed.html; then exit 1; fi # without pictures, only the labelled boxes (docs/images.md); a leading ! would not fail the step
          # with pictures: an <img> for a slot that has its file, served as an image; no SVG
          mkdir img
          for f in logo-rating-1 logo-bar; do echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII= | base64 -d > "img/$f.png"; done
          echo '<svg/>' > img/x.svg
          docker run -d --name web-img -p 8081:8080 -e IMAGES_DIR=/images -v "$PWD/img:/images:ro" web:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8081/feed > feed-img.html && break; sleep 1; done
          grep -q 'asset-slot has-image' feed-img.html
          curl -s -D h.txt -o /dev/null http://localhost:8081/images/logo-rating-1.png
          grep -qi '^content-type: image/png' h.txt
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/images/x.svg)" = 404 ]
          curl -sf http://localhost:8081/images.json | grep -q '"logo-bar.png":"[0-9a-f]*"' # the launcher's list (docs/images.md)
          if curl -sf http://localhost:8081/images.json | grep -q 'x.svg'; then exit 1; fi
          curl -sf http://localhost:8081/images-missing.json | grep -q '"logo-rating-2":"/feed"' # a box /feed drew (docs/images.md)
          if curl -sf http://localhost:8081/images-missing.json | grep -q '"logo-rating-1"'; then exit 1; fi
          [ "$(curl -sf http://localhost:8080/images.json)" = '{}' ]
          docker exec web sh -c 'touch /home/app/.aspnet/DataProtection-Keys/probe && rm /home/app/.aspnet/DataProtection-Keys/probe' # the app user keeps the cookie-signing keys across deploys (src/Web/Dockerfile)
      - if: failure()
        run: docker logs web; docker logs web-img
  # the community server's container image (deploy/): builds, starts on plain HTTP with an empty install, answers, may write /data, and the backup command runs
  docker-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f server/Server/Dockerfile -t server:ci .
      - name: Smoke test
        run: |
          mkdir -p srv/install
          jq '.install_dir = "install" | del(.variants_file) | .data_dir = "/data" | .listeners = [{address: "0.0.0.0", port: 8080}]' server/Server/settings.example.json > srv/settings.json
          docker volume create serverdata
          docker run -d --name server -p 8080:8080 -v serverdata:/data -v "$PWD/srv:/srv:ro" server:ci
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" != 000 ] && break; sleep 1; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" != 000 ]
          docker exec server sh -c 'touch /data/probe && rm /data/probe' # the app user owns the volume
          docker exec server dotnet server.dll backup /backups 7
      - if: failure()
        run: docker logs server
