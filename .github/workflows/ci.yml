name: ci
on:
  push:
    branches: [main]
  pull_request:
  # dependabot-locks.yml starts it for the lock-file commit it pushes (a push with GITHUB_TOKEN starts no workflow); never deploys (deploy.yml: push only)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      RestoreLockedMode: "true" # every restore of this job (build, test, publish.cmd) fails with NU1004 when a packages.lock.json does not match its project
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sdk
      - run: dotnet build hunter-resurgence.slnx -c Release
      - run: dotnet test hunter-resurgence.slnx -c Release --no-build
      # the release's publish and zip step, with the example settings: a change that breaks it fails the pull request, not a release tag (tags cannot be reused)
      - name: Publish the backup tool
        shell: cmd
        run: tools\backup\publish.cmd tools\backup\settings.example.json 0.0.0-ci
      - name: Check the release zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "tools\backup\bin\Release\net10.0-windows\win-x64\backup-win-x64.zip"))
          $names = ($zip.Entries.FullName | Sort-Object) -join ","
          $zip.Dispose()
          if ($names -ne "backup.exe,settings.json") { throw "zip holds: $names" }
      # the player kit's release zip, the same way (tools/play)
      - name: Publish the player kit
        shell: cmd
        run: tools\play\publish.cmd tools\play\settings.example.json 0.0.0-ci
      - name: Check the player kit's release zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "tools\play\bin\Release\net10.0-windows\win-x64\play-win-x64.zip"))
          $names = ($zip.Entries.FullName | Sort-Object) -join ","
          $zip.Dispose()
          if ($names -ne "1-setup.cmd,2-run.cmd,3-remove.cmd,play.exe,settings.json") { throw "zip holds: $names" }
  # the server's tests on Linux too: operators run the community server on a VPS (the build job above runs them on Windows with the rest of the solution)
  server-ubuntu:
    runs-on: ubuntu-latest
    env:
      RestoreLockedMode: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sdk
      - run: dotnet test --project server/Server.Tests -c Release
  # the website's container image (deploy/): builds, starts, serves the banner and the import map of shell.js, lists Linux time zones, serves robots.txt, and sends the security headers
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f src/Web/Dockerfile -t web:ci .
      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:8080 web:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/feed > feed.html && break; sleep 1; done
          grep -q "Work in progress" feed.html
          grep -qE '_content/Resurgence\.Ui/shell\.[a-z0-9]+\.js' feed.html # the import map sends shell.js to its fingerprinted file (docs/website.md)
          curl -sf http://localhost:8080/settings/language | grep -q 'value="Europe/Paris"'
          curl -sf http://localhost:8080/robots.txt | grep -q '^User-agent: MJ12bot' # docs/website.md
          # the security headers on a page and on the 404 page (docs/website.md#security-headers)
          for path in /feed /no-such-page; do
            curl -s -D headers.txt -o /dev/null "http://localhost:8080$path"
            grep -qi '^strict-transport-security: max-age=31536000' headers.txt
            grep -qi '^x-content-type-options: nosniff' headers.txt
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' headers.txt
            grep -qi "^content-security-policy: frame-ancestors 'none'" headers.txt
          done
      - if: failure()
        run: docker logs web
  # the community server's container image (deploy/): builds, starts on plain HTTP with an empty install, answers, may write /data, and the backup command runs
  docker-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f server/Server/Dockerfile -t server:ci .
      - name: Smoke test
        run: |
          mkdir -p srv/install
          jq '.install_dir = "install" | del(.variants_file) | .data_dir = "/data" | .listeners = [{address: "0.0.0.0", port: 8080}]' server/Server/settings.example.json > srv/settings.json
          docker volume create serverdata
          docker run -d --name server -p 8080:8080 -v serverdata:/data -v "$PWD/srv:/srv:ro" server:ci
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" != 000 ] && break; sleep 1; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" != 000 ]
          docker exec server sh -c 'touch /data/probe && rm /data/probe' # the app user owns the volume
          docker exec server dotnet server.dll backup /backups 7
      - if: failure()
        run: docker logs server
