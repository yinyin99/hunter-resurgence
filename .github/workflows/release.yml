name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RestoreLockedMode: "true" # every restore of this job (build, test, publish.cmd) fails with NU1004 when a packages.lock.json does not match its project
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-sdk
      # The tag is the only version: vX.Y.Z or vX.Y.Z-suffix, checked before anything is built.
      - name: Version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "tag $env:TAG is not vMAJOR.MINOR.PATCH[-suffix]" }
          "VERSION=$ver" >> $env:GITHUB_ENV
      - run: dotnet build tools/backup -c Release -p:Version=${{ env.VERSION }}
      - run: dotnet build tools/play -c Release -p:Version=${{ env.VERSION }}
      - run: dotnet build src/Launcher -c Release -p:Version=${{ env.VERSION }}
      - run: dotnet test tests/Resurgence.Tests -c Release
      # One repository secret per settings.json key. Values are never printed; every key is required, so a missing secret fails the release.
      - name: Write settings.json
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          WEB_HOST: ${{ secrets.WEB_HOST }}
          PHOTO_HOST: ${{ secrets.PHOTO_HOST }}
          STATIC_HOST: ${{ secrets.STATIC_HOST }}
          AVATAR_HOST: ${{ secrets.AVATAR_HOST }}
          OAUTH_CONSUMER_KEY: ${{ secrets.OAUTH_CONSUMER_KEY }}
          CLIENT_EXE: ${{ secrets.CLIENT_EXE }}
          CRASH_HOST: ${{ secrets.CRASH_HOST }}
          PLAY_SERVER_URL: ${{ secrets.PLAY_SERVER_URL }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          LAUNCHER_CLIENT_EXE: ${{ secrets.LAUNCHER_CLIENT_EXE }}
          GRAPHICS_FILE: ${{ secrets.GRAPHICS_FILE }}
          OPTIONS_FILE: ${{ secrets.OPTIONS_FILE }}
          OPTIONS_KEY_PREFIX: ${{ secrets.OPTIONS_KEY_PREFIX }}
        run: |
          $s = [ordered]@{
            client_exe         = $env:CLIENT_EXE
            oauth_consumer_key = $env:OAUTH_CONSUMER_KEY
            web_host           = $env:WEB_HOST
            photo_host         = $env:PHOTO_HOST
            static_host        = $env:STATIC_HOST
            avatar_host        = $env:AVATAR_HOST
          }
          foreach ($k in @($s.Keys)) {
            $s[$k] = "$($s[$k])".Trim()
            if (-not $s[$k]) { throw "repository secret for $k is missing or blank" }
          }
          # optional: the community server for "Send to the community server"; without it the button is hidden
          if ("$env:SERVER_URL".Trim()) { $s["server_url"] = $env:SERVER_URL.Trim() }
          $s | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\settings.json"
          # the player kit's settings.json: the community server, the web host the game sends everything to (the backup tool's web_host) and the crash report host. Only when PLAY_SERVER_URL is set: without it the release has the backup tool alone.
          if (-not $env:PLAY_SERVER_URL) { Write-Host "PLAY_SERVER_URL is not set: no player kit in this release" }
          else {
            $p = [ordered]@{
              server_url         = $env:PLAY_SERVER_URL
              game_web_host      = $env:WEB_HOST
              crash_host         = $env:CRASH_HOST
            }
            foreach ($k in @($p.Keys)) {
              $p[$k] = "$($p[$k])".Trim()
              if (-not $p[$k]) { throw "repository secret for $k is missing or blank" }
            }
            $p | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\play-settings.json"
            # the launcher's settings.json, only when STEAM_APP_ID is set (without it the release has no launcher): the example (placeholders mean "not configured") with the community server's address
            if (-not $env:STEAM_APP_ID) { Write-Host "STEAM_APP_ID is not set: no launcher in this release" }
            else {
            $l = Get-Content src\Launcher\settings.example.json -Raw | ConvertFrom-Json
            $l.server_url = $env:PLAY_SERVER_URL.Trim()
            # the keys the launcher needs to find and start the game and edit its settings; all required with the launcher
            foreach ($m in @(@("steam_app_id", "STEAM_APP_ID"), @("client_exe", "LAUNCHER_CLIENT_EXE"), @("graphics_file", "GRAPHICS_FILE"), @("options_file", "OPTIONS_FILE"), @("options_key_prefix", "OPTIONS_KEY_PREFIX"))) {
              $v = "$([Environment]::GetEnvironmentVariable($m[1]))".Trim()
              if (-not $v) { throw "repository secret for $($m[1]) is missing or blank" }
              $l.($m[0]) = $v
            }
            $l | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\launcher-settings.json"
            "LAUNCHER=1" >> $env:GITHUB_ENV
            }
            "PLAY=1" >> $env:GITHUB_ENV
          }
      - name: Publish and zip
        shell: cmd
        run: tools\backup\publish.cmd "%RUNNER_TEMP%\settings.json" ${{ env.VERSION }}
      - name: Publish and zip the player kit
        if: env.PLAY == '1'
        shell: cmd
        run: tools\play\publish.cmd "%RUNNER_TEMP%\play-settings.json" ${{ env.VERSION }}
      # the launcher is packed with Velopack: Setup.exe, the full package, a delta against the latest release, releases.win.json (src/Launcher/publish.cmd)
      - name: Install vpk
        if: env.LAUNCHER == '1'
        run: dotnet tool install -g vpk --version 1.2.161
      # the earlier releases give the delta; without one (the first release) the packages are the full one alone
      - name: Download the earlier releases
        if: env.LAUNCHER == '1'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --outputDir "src\Launcher\bin\Release\net10.0-windows10.0.17763.0\win-x64\releases"
          if ($LASTEXITCODE -ne 0) { Write-Host "no earlier release to download: full package only"; $global:LASTEXITCODE = 0 }
      - name: Publish and pack the launcher
        if: env.LAUNCHER == '1'
        shell: cmd
        run: src\Launcher\publish.cmd "%RUNNER_TEMP%\launcher-settings.json" ${{ env.VERSION }}
      # Build provenance (attestations need a public repository on this plan: skipped while private).
      - name: Attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            tools/backup/bin/Release/net10.0-windows/win-x64/backup-win-x64.zip
            tools/backup/bin/Release/net10.0-windows/win-x64/publish/backup.exe
      - name: Attest the player kit
        if: ${{ env.PLAY == '1' && !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            tools/play/bin/Release/net10.0-windows/win-x64/play-win-x64.zip
            tools/play/bin/Release/net10.0-windows/win-x64/publish/play.exe
      - name: Attest the launcher
        if: ${{ env.LAUNCHER == '1' && !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: |
            src/Launcher/bin/Release/net10.0-windows10.0.17763.0/win-x64/releases/HunterResurgence-win-Setup.exe
            src/Launcher/bin/Release/net10.0-windows10.0.17763.0/win-x64/publish/resurgence-launcher.exe
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "tools\backup\bin\Release\net10.0-windows\win-x64\backup-win-x64.zip"
          $playZip = "tools\play\bin\Release\net10.0-windows\win-x64\play-win-x64.zip"
          $releases = "src\Launcher\bin\Release\net10.0-windows10.0.17763.0\win-x64\releases"
          $setup = "$releases\HunterResurgence-win-Setup.exe"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $play = $env:PLAY -eq '1'
          if ($play) { $playSha = (Get-FileHash $playZip -Algorithm SHA256).Hash.ToLower() }
          $launcher = $env:LAUNCHER -eq '1'
          if ($launcher) { $launcherSha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() }
          # checkout may turn an annotated tag into a lightweight one: fetch the real tag object, then use its message if there is one
          git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $notes = ""
          if ((git cat-file -t "refs/tags/$env:TAG") -eq "tag") {
            $msg = (git tag -l --format='%(contents)' $env:TAG) -join "`n"
            $notes = "## Changes`n`n$($msg.Trim())`n`n"
          }
          $notes += "SHA-256 of backup-win-x64.zip:`n`n$sha`n`n$(if ($play) { "SHA-256 of play-win-x64.zip:`n`n$playSha`n`n" })$(if ($launcher) { "SHA-256 of HunterResurgence-win-Setup.exe:`n`n$launcherSha`n`n" })The exes are not code-signed: Windows SmartScreen shows `"Unknown publisher`" (More info -> Run anyway). Compare the SHA-256 of the downloaded file with the value above (PowerShell: Get-FileHash backup-win-x64.zip).`n`nsettings.json in the backup zip holds the official service's host names, the game's exe name and the website's public consumer key in plain text: the app needs them to reach the official servers."
          if ($play) { $notes += " settings.json in the play zip holds the community server's address and the same host names: the player kit needs them to point the game at that server." }
          if ($launcher) { $notes += " To install the launcher, run HunterResurgence-win-Setup.exe: it installs for your user only (no admin), adds a shortcut and an Add/Remove programs entry, and the installed launcher updates itself from the later releases (the .nupkg files and releases.win.json are what it downloads). Its settings.json holds the community server's address and the game's identity and file names; the other keys are placeholders." }
          $notes | Set-Content notes.md
          $flags = @(); if ($env:TAG.Contains("-")) { $flags += "--prerelease" }
          # draft first, asset second, publish last: an immutable release is locked the moment it is published, so it must already be complete
          gh release create $env:TAG --draft --title $env:TAG --notes-file notes.md @flags
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release upload $env:TAG $zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($play) { gh release upload $env:TAG $playZip }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($launcher) { gh release upload $env:TAG $setup (Get-ChildItem "$releases\*-$env:VERSION-*.nupkg").FullName "$releases\releases.win.json" }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE -ne 0) { exit 1 }
