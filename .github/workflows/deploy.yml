name: deploy
# On a server-X.Y.Z tag of a commit of main whose ci passed: build the website and server images, push them to GHCR as <sha> and latest, roll them out on the VPS (docs/deploy.md).
# The launcher's vX.Y.Z tags are release.yml's and never deploy. A merge to main deploys nothing by itself.
# Without the three DEPLOY_* secrets (a fork, or no VPS yet) the job ends with a notice. The repository secrets LINK_BACKUP, LINK_SOURCE, LINK_DISCORD, GAME_NAME and GAME_FULL (the ones the release uses too) become the website's links and game name.
on:
  push:
    tags: ["server-*"]
permissions:
  contents: read
  packages: write
  actions: read # gh run list: the tagged commit's ci
jobs:
  deploy:
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.sha }}
      TAG: ${{ github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: the tagged commit must be on main
          persist-credentials: false
      # the tag names a version, the commit is merged, and its ci on main passed; a tag of an older commit is a rollback and deploys too
      - name: Check the tag, the commit, its ci and the deploy secrets
        id: secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ $TAG =~ ^server-[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not server-MAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main: merge it first"; exit 1; }
          # a tag pushed right after the merge: wait up to 30 min for the push's ci to finish
          for _ in $(seq 60); do
            run=$(gh run list --workflow ci --commit "$SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            [[ $run == completed* ]] && break
            sleep 30
          done
          [ "$run" = "completed success" ] || { echo "::error::ci of $SHA on main is '${run:-missing}', not a success: nothing deployed"; exit 1; }
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DEPLOY_HOST, DEPLOY_USER or DEPLOY_KEY is not set: nothing deployed"; fi
      - if: steps.secrets.outputs.ok
        uses: docker/setup-buildx-action@v4
      # the layers come from the cache ci wrote on main for this same commit (.github/actions/build-image): nothing is rebuilt
      - name: Build and push the images
        if: steps.secrets.outputs.ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for part in web:src/Web server:server/Server natpt:server/natpt; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${part%%:*}"
            ctx=.; [ "${part%%:*}" = natpt ] && ctx=server/natpt # its context is its own folder
            docker buildx build -f "${part#*:}/Dockerfile" --cache-from "type=registry,ref=$image:buildcache" --provenance=false --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:$SHA" -t "$image:latest" --push "$ctx"
          done
      # the running versions are recorded on the host: WEB_TAG=<sha>, SERVER_TAG=<sha> and NATPT_TAG=<sha> in ~/web/.env
      - name: Roll out
        if: steps.secrets.outputs.ok
        env:
          LINK_BACKUP: ${{ secrets.LINK_BACKUP }}
          LINK_DISCORD: ${{ secrets.LINK_DISCORD }}
          # the project's repository, for the feed's development note and the download page; a LINK_SOURCE secret wins
          LINK_SOURCE: ${{ secrets.LINK_SOURCE || format('{0}/{1}', github.server_url, github.repository) }}
          GAME_NAME: ${{ secrets.GAME_NAME }}
          GAME_FULL: ${{ secrets.GAME_FULL }}
        run: |
          # the secrets go into .env and into a single-quoted remote command: the links URL characters only, no ' $ # or spaces; the names letters, digits, spaces and . : - only
          # trimmed like the release does, so a pasted trailing newline or space is not part of the value
          for v in LINK_BACKUP LINK_SOURCE LINK_DISCORD GAME_NAME GAME_FULL; do x=${!v}; x=${x#"${x%%[![:space:]]*}"}; printf -v "$v" '%s' "${x%"${x##*[![:space:]]}"}"; done
          extra=""
          url='^https://[A-Za-z0-9._~:/?@!&+,;=%-]+$'
          for v in LINK_BACKUP LINK_SOURCE LINK_DISCORD; do
            [ -n "${!v}" ] || continue
            [[ ${!v} =~ $url ]] || { echo "::error::$v is not an https URL"; exit 1; }
            extra+=" && echo '$v=${!v}' >> .env"
          done
          name='^[A-Za-z0-9 .:-]+$'
          for v in GAME_NAME GAME_FULL; do
            [ -n "${!v}" ] || continue
            [[ ${!v} =~ $name ]] || { echo "::error::$v may hold only letters, digits, spaces and . : -"; exit 1; }
            extra+=" && echo '$v=\"${!v}\"' >> .env"
          done
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy)
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          scp -i ~/.ssh/deploy deploy/compose.yml deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:web/"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "cd web && sed -i -e 's/^WEB_TAG=.*/WEB_TAG=$SHA/' -e 's/^SERVER_TAG=.*/SERVER_TAG=$SHA/' -e 's/^NATPT_TAG=.*/NATPT_TAG=$SHA/' .env && sed -i -e '/^\(LINK_BACKUP\|LINK_DISCORD\|LINK_SOURCE\|GAME_NAME\|GAME_FULL\)=/d' -e '\$a\\' .env$extra && docker compose pull && docker compose up -d && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile && docker image prune -f"
      - if: always()
        run: rm -f ~/.ssh/deploy
