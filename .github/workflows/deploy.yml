name: deploy
# After a green ci run of a push to main: build the website and server images, push them to GHCR as <sha> and latest, roll them out on the VPS (docs/deploy.md).
# Without the three DEPLOY_* secrets (a fork, or no VPS yet) the job ends with a notice. The repository secrets LINK_BACKUP, LINK_SOURCE, LINK_DISCORD, GAME_NAME and GAME_FULL (the ones the release uses too) become the website's links and game name.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    # a push to main of this repository only: pull requests (and so forks) never deploy, and no secret reaches them
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # on the job, not the workflow: a run whose job is skipped (a ci that was not a push to main) never holds or cancels a pending deploy
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      # two pushes close together deploy in the order their ci runs end, not in commit order: a commit that is no longer main's head rolls nothing out, since the newer one's deploy does (#230)
      - name: Check the deploy secrets and that this is main's head
        id: secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then echo "::notice::main is at $head now, not $SHA: its own deploy rolls it out; nothing deployed"
          elif [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DEPLOY_HOST, DEPLOY_USER or DEPLOY_KEY is not set: nothing deployed"; fi
      # workflow_run runs this file from the default branch without a checkout of the tested commit
      - if: steps.secrets.outputs.ok
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build and push the images
        if: steps.secrets.outputs.ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for part in web:src/Web server:server/Server; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${part%%:*}"
            docker build -f "${part#*:}/Dockerfile" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image:$SHA" -t "$image:latest" .
            docker push --all-tags "$image"
          done
      # the running versions are recorded on the host: WEB_TAG=<sha> and SERVER_TAG=<sha> in ~/web/.env
      - name: Roll out
        if: steps.secrets.outputs.ok
        env:
          LINK_BACKUP: ${{ secrets.LINK_BACKUP }}
          LINK_DISCORD: ${{ secrets.LINK_DISCORD }}
          # the project's repository, for the feed's development note and the download page; a LINK_SOURCE secret wins
          LINK_SOURCE: ${{ secrets.LINK_SOURCE || format('{0}/{1}', github.server_url, github.repository) }}
          GAME_NAME: ${{ secrets.GAME_NAME }}
          GAME_FULL: ${{ secrets.GAME_FULL }}
        run: |
          # the secrets go into .env and into a single-quoted remote command: the links URL characters only, no ' $ # or spaces; the names letters, digits, spaces and . : - only
          # trimmed like the release does, so a pasted trailing newline or space is not part of the value
          for v in LINK_BACKUP LINK_SOURCE LINK_DISCORD GAME_NAME GAME_FULL; do x=${!v}; x=${x#"${x%%[![:space:]]*}"}; printf -v "$v" '%s' "${x%"${x##*[![:space:]]}"}"; done
          extra=""
          url='^https://[A-Za-z0-9._~:/?@!&+,;=%-]+$'
          for v in LINK_BACKUP LINK_SOURCE LINK_DISCORD; do
            [ -n "${!v}" ] || continue
            [[ ${!v} =~ $url ]] || { echo "::error::$v is not an https URL"; exit 1; }
            extra+=" && echo '$v=${!v}' >> .env"
          done
          name='^[A-Za-z0-9 .:-]+$'
          for v in GAME_NAME GAME_FULL; do
            [ -n "${!v}" ] || continue
            [[ ${!v} =~ $name ]] || { echo "::error::$v may hold only letters, digits, spaces and . : -"; exit 1; }
            extra+=" && echo '$v=\"${!v}\"' >> .env"
          done
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy)
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          scp -i ~/.ssh/deploy deploy/compose.yml deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:web/"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "cd web && sed -i -e 's/^WEB_TAG=.*/WEB_TAG=$SHA/' -e 's/^SERVER_TAG=.*/SERVER_TAG=$SHA/' .env && sed -i -e '/^\(LINK_BACKUP\|LINK_DISCORD\|LINK_SOURCE\|GAME_NAME\|GAME_FULL\)=/d' -e '\$a\\' .env$extra && docker compose pull && docker compose up -d && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile && docker image prune -f"
      - if: always()
        run: rm -f ~/.ssh/deploy
