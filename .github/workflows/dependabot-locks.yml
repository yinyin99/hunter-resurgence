name: dependabot-locks
# A Dependabot update needs every packages.lock.json it affects, or the locked restore fails (NU1004): an SDK update (global.json, src/Web/Dockerfile, server/Server/Dockerfile) changes all of them,
# a NuGet update (a .csproj) those of the projects that reference the bumped one too, which Dependabot leaves alone (server/Server.Tests references server/Server).
# This regenerates them on the pull request's branch and commits them; workflow_dispatch does the same for a branch by hand (docs/deploy.md).
# The pull_request run of ci on that commit waits for a maintainer's approval (a commit by github-actions[bot]); once approved, its checks count for the pull request.
on:
  pull_request:
    paths: [global.json, src/Web/Dockerfile, server/Server/Dockerfile, '**/*.csproj', '**/packages.lock.json']
  workflow_dispatch:
permissions: {}
jobs:
  locks:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: windows-latest # as ci: the backup tool is a Windows project
    permissions:
      contents: write # push the lock files
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false # the restore runs NuGet and MSBuild code: no token in .git/config; only the push step gets it
      # exactly the SDK of global.json, the Dockerfile's sdk tag, or the lock files would be those of the newest 10.0 SDK of the runner (action: .github/actions/setup-sdk)
      - uses: ./.github/actions/setup-sdk
      - run: dotnet restore hunter-resurgence.slnx --force-evaluate
      - name: Commit the lock files
        id: commit
        shell: bash
        run: |
          git add -- ':(glob)**/packages.lock.json'
          if git diff --cached --quiet; then echo "::notice::lock files already up to date"; exit 0; fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: regenerate lock files"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: Push the lock files
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth" # the token is masked in logs, its base64 form is not
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$BRANCH"
