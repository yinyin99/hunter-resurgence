name: discord-thread-status
# When an issue is closed or reopened, replies in the Discord forum thread linked in its body and sets the thread's status tag (docs/deploy.md, "Discord thread status").
# The issue's title and body are untrusted: the script reads the event file itself and nothing of it is put in a shell line.
# Without the secrets DISCORD_BOT_TOKEN and DISCORD_GUILD_ID (a fork) the script ends with a notice.
on:
  issues:
    types: [closed, reopened]
permissions:
  contents: read
concurrency:
  group: discord-thread-status-${{ github.event.issue.number }}
  cancel-in-progress: false # a run is never cut short; a newer event for the issue waits its turn
jobs:
  thread:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: node .github/scripts/discord-thread-status.mjs
